  <script>
    // 子頁面 SPA 切換 (僅用於內部子頁面切換，外部連結完全交由原生 a[target="_blank"] 處理以通過 Wix Sandbox)
    function navigateWixPage(pageId) {
      document.querySelectorAll('.wix-spa-page').forEach(function(el) {
        el.classList.add('hidden');
      });
      var target = document.getElementById('wix-page-' + pageId);
      if (target) {
        target.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
